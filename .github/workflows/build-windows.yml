name: Windows LIGGGHTS executable (experimental)

on:
  push:
    branches:
      - windows-build-msvc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 / ${{ matrix.flavour }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: serial
            enable_mpi: "OFF"
          - flavour: mpi
            enable_mpi: "ON"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Microsoft MPI and SDK (parallel build only)
        if: matrix.enable_mpi == 'ON'
        shell: pwsh
        run: |
          winget install --id Microsoft.msmpi --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "Failed to install MS-MPI runtime" }
          winget install --id Microsoft.msmpisdk --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "Failed to install MS-MPI SDK" }
          $sdk = "${env:ProgramFiles(x86)}\Microsoft SDKs\MPI"
          if (!(Test-Path "$sdk\Include\mpi.h")) { throw "MS-MPI SDK headers were not installed at $sdk" }
          "MSMPI_INC=$sdk\Include" >> $env:GITHUB_ENV
          "MSMPI_LIB64=$sdk\Lib\x64" >> $env:GITHUB_ENV
          $runtime = "$env:ProgramFiles\Microsoft MPI\Bin"
          "$runtime" >> $env:GITHUB_PATH

      - name: Configure with Visual Studio 2022 (x64)
        shell: pwsh
        run: |
          cmake -S src -B build -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_MPI=${{ matrix.enable_mpi }} `
            -DENABLE_VTK=OFF `
            -DENABLE_SQ=OFF `
            -DENABLE_MODEL_COHESION_OFF=ON `
            -DENABLE_MODEL_TANGENTIAL_OFF=ON `
            -DENABLE_MODEL_ROLLING_OFF=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile LIGGGHTS
        shell: pwsh
        run: |
          cmake --build build --config Release --target liggghts_bin --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test Windows solver
        shell: pwsh
        run: |
          $exe = "build/Release/liggghts.exe"
          if (!(Test-Path $exe)) { throw "Compiled executable not found: $exe" }
          if ('${{ matrix.enable_mpi }}' -eq 'ON') {
            & mpiexec.exe -n 2 $exe -in .github/smoke/windows_smoke.in
          } else {
            & $exe -in .github/smoke/windows_smoke.in
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: liggghts-windows-x64-${{ matrix.flavour }}
          path: build/Release/liggghts.exe
          if-no-files-found: error
          retention-days: 30
